name: Juice Shop Semgrep SARIF Triage

on:
  workflow_dispatch: # Allows you to manually trigger this scan from your Actions tab

permissions:
  contents: read
  security-events: write # Mandatory: Allows the runner to upload findings to your Security Tab

jobs:
  semgrep-sarif:
    name: Semgrep Code Scanning
    runs-on: ubuntu-latest

    steps:
      # Step 1: Natively checkout your forked Juice Shop codebase
      - name: Checkout Forked Codebase
        uses: actions/checkout@v4

      # Step 2: Run Semgrep on the root directory
       - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: 'p/default p/nodejs'
          path: '.'
          generateSarif: 'semgrep-results.sarif'
        continue-on-error: true # Keeps the job running even when flaws are found

      # Step 3: Parse and upload the findings directly to your GitHub UI
       - name: Upload SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ github.workspace }}/semgrep-results.sarif
          category: semgrep-juice-shop
